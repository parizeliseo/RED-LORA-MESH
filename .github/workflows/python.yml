# Prueba el puente MQTT de Python (puente-mqtt/puente-mqtt.py) y revisa todo el código Python del
# repositorio. No instala nada raro: el puente solo usa lo que trae Python, y la prueba levanta su
# propio servidor MQTT de mentira, así que no depende de Internet ni de servidores de terceros.
#
# Se prueba donde de verdad se usa: en Windows y en Linux, con el Python más viejo que el puente
# promete soportar (3.8) y con el más nuevo.
name: Puente MQTT (Python)

on:
  push:
    branches: [main]
    paths: ["puente-mqtt/**", "**.py", ".github/workflows/python.yml"]
  pull_request:
    paths: ["puente-mqtt/**", "**.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puente:
    name: Puente en ${{ matrix.sistema }} con Python ${{ matrix.python }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 ya no se publica para el Ubuntu más nuevo: se prueba en 24.04
          - { sistema: ubuntu-24.04, python: "3.8" }
          - { sistema: ubuntu-latest, python: "3.14" }
          - { sistema: windows-latest, python: "3.8" }
          - { sistema: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Probar el puente
        run: python puente-mqtt/pruebas/t_puente_solo.py

  revisar:
    name: Revisar el código Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Que todos los archivos compilen
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile && echo "Todos los archivos .py compilan."

      - name: Errores de programación (flake8)
        run: |
          python -m pip install --quiet flake8
          # solo lo que es un error de verdad: sintaxis, nombres que no existen, comparaciones mal hechas
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
