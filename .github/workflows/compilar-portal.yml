# Comprueba que el portal compile y que el archivo resultante sea un portal válido, y lo prueba
# en un navegador de verdad: todas las pantallas (PC y celular), una carga de 10.000 nodos y
# 50.000 mensajes, el almacén grande del historial y la conexión con un nodo de prueba.
# No publica nada: solo avisa si un cambio rompió algo.
name: Compilar el portal

on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/compilar-portal.yml"]
  pull_request:
    paths: ["portal/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: portal
        run: npm ci || npm install

      - name: Compilar
        working-directory: portal
        run: node build.mjs

      - name: Revisar el resultado
        working-directory: portal
        run: |
          set -e
          ARCHIVO=dist/portal-meshtastic.html
          test -f "$ARCHIVO" || { echo "No se generó $ARCHIVO"; exit 1; }
          KB=$(( $(stat -c%s "$ARCHIVO") / 1024 ))
          echo "Tamaño: ${KB} KB"
          [ "$KB" -gt 300 ] || { echo "El archivo quedó demasiado chico: algo no se incluyó"; exit 1; }
          grep -q "Sistema LoRa Mesh" "$ARCHIVO" || { echo "Falta el título del portal"; exit 1; }
          echo "El portal compiló bien."

      - name: Guardar el portal compilado
        uses: actions/upload-artifact@v7
        with:
          name: portal-lora-mesh
          path: portal/dist/portal-meshtastic.html
          retention-days: 14

  probar:
    name: Probar el portal en un navegador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compilar el portal
        working-directory: portal
        run: |
          npm ci || npm install
          node build.mjs

      - name: Instalar el navegador de prueba
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Todas las pantallas, en PC y en celular
        working-directory: portal
        run: python pruebas/t_pantallas.py

      - name: Conectado a un nodo de prueba por la red
        working-directory: portal
        run: python pruebas/t_conectado.py

      - name: Historial grande guardado (IndexedDB), copia y restauración
        working-directory: portal
        run: python pruebas/t_almacen.py

      - name: Carga de 10.000 nodos y 50.000 mensajes
        working-directory: portal
        run: python pruebas/t_carga.py
